<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>osu!mania → Psych Engine 1.0.4</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="eyebrow">4K CHART CONVERTER</div>
      <h1>osu!mania <span>→</span> Psych Engine</h1>
      <p>Convert osu!mania 4K maps into a Psych Engine 1.0.4 mod.</p>
    </header>

    <section class="card">
      <label class="drop" id="dropZone">
        <input id="fileInput" type="file" accept=".osz,.zip" multiple>
        <div class="drop-icon">♪</div>
        <strong>Drop one or more .osz files here</strong>
        <span>or click to browse • multiple files supported</span>
      </label>

      <div id="status" class="status hidden"></div>

      <section id="mapInfo" class="map-info hidden">
        <div>
          <small>MAP</small>
          <h2 id="title">—</h2>
          <p id="artist">—</p>
        </div>
        <div class="stats">
          <div><b id="keys">—</b><small>KEYS</small></div>
          <div><b id="bpm">—</b><small>BPM</small></div>
          <div><b id="objects">—</b><small>OBJECTS</small></div>
        </div>
      </section>

      <section id="difficultyPanel" class="difficulty hidden">
        <h3>Select a 4K difficulty</h3>
        <div id="difficultyList"></div>
      </section>

      <div class="actions"><button id="convertBtn" class="convert" disabled>CONVERT TO PSYCH 1.0.4</button><button id="jsonBtn" class="json-download" disabled>DOWNLOAD SONG JSON</button></div>
      <p class="privacy">Everything is processed locally in your browser. Your map is not uploaded.</p>
    </section>

    <footer>osu!mania only • 4K only • Psych Engine 1.0.4</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
